{%- assign _WORKER_URL = site.pageview.leancloud.worker_url -%}

{%- if _WORKER_URL -%}
  <script>
    {%- include pageview-providers/leancloud/leancloud.js -%}
  </script>
  <script>
    (function() {
      var pv = window.pageview({ workerUrl: '{{ _WORKER_URL }}' });
      function loadViews() {
        var els = document.querySelectorAll('.js-pageview');
        els.forEach(function(el) {
          var key = el.getAttribute('data-page-key');
          if (key) {
            pv.get(key, function(view) {
              el.setAttribute('itemprop', 'userInteractionCount');
              el.setAttribute('content', view);
              el.textContent = view;
            });
          }
        });
      }
      if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', loadViews);
      } else {
        loadViews();
      }
    })();
  </script>
{%- endif -%}
